name: Toy Story 2 (North America)
sha1: 982ad2e1e44c6662c88a77367bc5df91c51531bf
options:
  basename: toystory2
  target_path: ..\..\rom\baserom.us.rev0.z64
  elf_path: build/toystory2.elf
  base_path: .
  platform: n64
  compiler: KMC

  # asm_path: asm
  # src_path: src
  # build_path: build
  # create_asm_dependencies: True

  ld_script_path: toystory2.ld
  ld_dependencies: True

  find_file_boundaries: True
  header_encoding: ASCII

  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  # section_order: [".text", ".data", ".rodata", ".bss"]
  # auto_link_sections: [".data", ".rodata", ".bss"]

  symbol_addrs_path:
    - symbol_addrs.txt
  reloc_addrs_path:
    - reloc_addrs.txt

  # undefined_funcs_auto_path: undefined_funcs_auto.txt
  # undefined_syms_auto_path: undefined_syms_auto.txt

  extensions_path: tools/splat_ext

  # string_encoding: ASCII
  # data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  # libultra_symbols: True
  # hardware_regs: True
  # gfx_ucode: # one of [f3d, f3db, f3dex, f3dexb, f3dex2]
segments:
  - name: header
    type: header
    start: 0x0

  - name: ipl3
    type: bin
    start: 0x40

  - name: entry # This game uses a non-traditional entrypoint, meaning splat's analysis may be wrong
    type: code
    start: 0x1000
    vram: 0x80006000
    subsegments:
      - [0x1000, hasm]
      - [0x103C, data]

  - name: main
    type: code
    start: 0x1840
    vram: 0x80006840
    follows_vram: entry
    subsegments:
      - [0x1840, asm]

  - type: bin
    start: 0x66D80
    follows_vram: main

  - [0xC00000]
