# SpaceRanger
# Toy Story 2 USA Rev 0
#
# N64Recomp symbol map.
#
# Low-memory overlays
# -------------------
# The game's loader dispatch table (VRAM 0x800A0920, 99 entries) maps loader
# ids 0..17 and 98 to NINETEEN distinct ROM overlays, ALL of which are DMA'd
# to the same VRAM window starting at 0x80000400. Their ROM images are
# contiguous: ROM [0xA68A0, 0xD87E0).
#
# Sections are named by loader id (ovlNN) and every symbol carries its overlay
# prefix, because the same VRAM address holds different code depending on which
# overlay is resident. Calls from resident code to a shared low-memory address
# must resolve through runtime overlay lookup.
#
# Resident func_80021D94 is a 17-case dispatcher (jump table 0x800A10A0) in
# which case N calls into overlay N; all 17 targets are clean entries in the
# matching overlay. Overlay 1's data section begins with the string "level01".
#
# Some overlays expose two resident entry points that converge on shared tail
# code. Their ranges deliberately OVERLAP, each covering everything its own
# entry can reach, so that no function contains a branch that leaves it. This
# is the same shared-entry model validated for ovl16 in Pass 8.
#
# See docs/lowmem-overlay-table-audit.txt and docs/lowmem-overlay-map.txt.
# ovl16 and ovl98 keep the function tables already accepted by N64Recomp;
# only their section and symbol names changed.
#
# Resident boundary corrections (Pass 11)
# -----------------------------------------
# N64Recomp requires every function to contain all of its own branch targets.
# Splat's resident extents violated this in 16 places. Each was resolved from
# the ROM, not normalized in bulk:
#   * 12 functions EXTENDED to their CFG-reachable extent. The largest,
#     func_8005D69C, grows to 0x8E9C -- it and the five starts Splat placed
#     inside it are one function: 0x800664FC branches back to 0x8005D7CC and
#     0x80066504 is the shared epilogue.
#   * 4 entries DELETED as spurious splits (func_8001A200, func_8001A420,
#     func_80024190, func_80030EC4). None has a genuine inbound reference;
#     0x8001A200, for instance, is a `jal` instruction sitting mid-loop inside
#     func_8001A18C. The two apparent callers were junk words inside
#     inter-function filler that Splat had absorbed into the functions below.
#   * 7 further entries DELETED as splits of a function that already covers
#     them and that nothing references: func_8001D3CC, plus the six Splat
#     placed inside func_8005D69C. Every other contained entry (10 of them)
#     is a genuine alternate entry with a real caller and a correct extent,
#     so those keep their deliberately overlapping ranges.
#   * func_8009D29C and func_8009E1A4 TRIMMED to their real `jr $ra` + delay
#     slot, and the real function starts they had swallowed (func_8009D2E0,
#     func_8009E240) declared. Both close cleanly with zero escaping branches.
#
# Resident extents are now derived, not inherited
# ----------------------------------------------
# Every resident function's extent is its CFG-reachable closure from its own
# entry, verified to end on a flow-end instruction plus delay slot and to
# contain all of its own branch targets. 103 extents were corrected this way
# (14 extended, 89 trimmed) and 17 functions Splat had buried inside others
# were recovered by re-resolving every jal target reachable from live code.
# The pass reaches a fixpoint in one round with no unresolved jal targets.
#
# Trims matter as much as extensions: Splat routinely absorbed inter-function
# filler, and words in that filler decode as plausible branches and calls.
# That is what produced phantom callers for addresses that are not functions
# at all (0x8001A200 is a `jal` sitting mid-loop inside func_8001A18C).
#
# The libultra scheduler is named too (osCreateScheduler, osSc*, __sc*). Those
# are NOT in N64Recomp's ignored list, so naming them changes no code - it only
# makes the symbols available to the host, which calls them by name. Two of them
# (osScRemoveClient, __scMain) had to be declared first: the scheduler reaches
# them through function pointers, so no jal targets them and a reachability
# sweep cannot see them. Addresses recovered from the working OldNative build
# and verified against this ROM.
#
# libultra functions carry their canonical names
# ---------------------------------------------
# N64Recomp ships a list of 384 libultra symbols it deliberately does NOT
# recompile (src/symbol_lists.cpp, mirrored to docs/n64recomp-ignored-funcs.txt),
# because N64ModernRuntime implements them natively. Naming a function
# correctly is therefore better than stubbing it: osGetCount returns a real
# counter, the cache routines become real no-ops, and __osDispatchThread is
# handled by the actual scheduler, rather than every one of them getting an
# empty body. Each rename below was classified from its disassembly first.

[[section]]
name = "entry"
rom = 0x1000
vram = 0x80006000
size = 0x3C

functions = [
  { name = "entrypoint", vram = 0x80006000, size = 0x3C },
]

