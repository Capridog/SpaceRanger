# SpaceRanger
# Toy Story 2 USA Rev 0
#
# Diagnostic recompilation.
# Stubs are native-runtime boundaries only: handwritten R4300
# exception/cache routines that have no meaning on a native host.
# No game logic is stubbed, skipped, or faked.

[input]

entrypoint = 0x80006000

symbols_file_path = "toystory2.us.rev0.syms.toml"

rom_file_path = "../rom/baserom.us.rev0.z64"

output_func_path = "../generated/recomp"

functions_per_output_file = 50

trace_mode = false


[patches]

stubs = [
    # Handwritten N64 exception-vector/preamble blob.
    # Native execution is replaced by the modern runtime boundary.
    "func_80007780",

    # libultra osWritebackDCacheAll.
    # ROM 0x289C / VRAM 0x8000789C.
    # Sweeps the 8 KiB N64 D-cache with Index_Writeback_Inv_D.
    # Native host execution does not reproduce the R4300 physical cache.
    "func_8000789C",

    # Full N64 instruction-cache invalidation helper.
    # ROM 0x28B8 / VRAM 0x800078B8.
    # Uses Index_Invalidate_I across the physical R4300 I-cache.
    # Native host execution does not reproduce the N64 CPU cache.
    "func_800078B8",

    # Handwritten libultra exception dispatcher (__osException boundary).
    # Reads CP0 Cause/EPC, saves/restores OSThread machine context,
    # dispatches hardware exceptions/interrupts, and returns with ERET.
    # Native runtime replaces raw R4300 exception entry/return semantics.
    "func_800078EC",

    # Handwritten hardware exception-context snapshot routine.
    # Saves GPR/HI/LO/FPU state and raw CP0 registers 0..31.
    # Its observed use is inside the native-replaced exception path.
    # Host execution does not expose an R4300 CP0 register file.
    "func_80007CFC",





]
# func_800982E0 is Toy Story 2's osPiRawReadIo. src/ts2_phase5b2b_timer_pi_compat.cpp
# reimplements it natively on the proven synchronous ROM PIO primitive, so the
# recompiler must emit nothing for it. "ignored" is required here rather than
# "stubs": main.cpp gates emission on (!func.ignored && func.words.size() != 0),
# so a stub would still emit an empty body and remain a duplicate definition.
#
# The five below access N64 device registers (SI at 0xA4800000, and the AI/PIF
# domain). Recompiled guest code reaches memory as rdram[guest_addr-0x80000000],
# which is only valid for RDRAM, so a generated body for any of these indexes
# far outside the 8 MB buffer and faults the process with an access violation.
# They are provided host-side instead:
#   func_800980E0 / func_800981A0  src/ts2_phase5b2b_missing_lowlevel.c
#                                  (real implementations; SI register accesses
#                                   routed through the bridge in
#                                   ts2_generated_bridge_layer.c)
#   func_80098240 / func_8009C2C0 / func_800A06A0
#                                  src/ts2_frontend_unresolved_safety_traps.cpp
#                                  (diagnostics: the old native build never
#                                   reached these paths)
#
ignored = [
    "func_800982E0",
    "func_800980E0",
    "func_800981A0",
    "func_80098240",
    "func_8009C2C0",
    "func_800A06A0",
]

# MusInitialize's default_fxbank must be RAM-backed. The adjacent wbk remains
# the cartridge pointer; func_8001923C loads and initializes sfx.bfx separately.
# Preserve OldNative V121 without editing regenerated C: sw zero, 0x30(sp).
[[patches.instruction]]
func = "func_8001923C"
vram = 0x800192F8
value = 0xAFA00030

# Preserve the guest VI context updates used by the scheduler, while mirroring
# its selected mode and black flag to N64ModernRuntime's independent VI state.
[[patches.hook]]
func = "func_80097940"
before_vram = 0x80097940
text = "ts2_vi_mirror_mode(rdram, (uint32_t)ctx->r4);"

[[patches.hook]]
func = "func_80097DC0"
before_vram = 0x80097DC0
text = "ts2_vi_mirror_black((uint32_t)ctx->r4);"

